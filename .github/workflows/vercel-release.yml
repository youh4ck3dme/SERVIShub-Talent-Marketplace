name: Manual Vercel Release
# Disabled until Vercel project is linked and environments are configured.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Approved environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: vercel-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require scoped deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID"; exit 1; }
      - name: Pull Vercel deployment configuration
        run: |
          if [ "${{ inputs.target }}" = production ]; then ENVIRONMENT=production; else ENVIRONMENT=preview; fi
          npx --yes vercel@latest pull --yes --environment="$ENVIRONMENT" --token="$VERCEL_TOKEN"
      - name: Build and deploy prebuilt artifact
        run: |
          if [ "${{ inputs.target }}" = production ]; then ENVIRONMENT=production; else ENVIRONMENT=preview; fi
          npx --yes vercel@latest build --target="$ENVIRONMENT" --token="$VERCEL_TOKEN"
          if [ "$ENVIRONMENT" = production ]; then
            npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
