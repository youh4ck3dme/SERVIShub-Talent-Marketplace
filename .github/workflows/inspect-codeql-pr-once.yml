name: Inspect CodeQL PR Annotations

on:
  push:
    branches:
      - feature/talent-marketplace-migration
    paths:
      - .github/workflows/inspect-codeql-pr-once.yml

permissions:
  contents: read
  checks: read
  security-events: read

jobs:
  annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch security check annotations (no secrets or code output)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/117827967475/annotations?per_page=100" \
            --jq '.[] | {path, start_line, end_line, annotation_level, title, message}'
