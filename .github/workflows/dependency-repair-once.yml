name: One-time dependency repair

on:
  push:
    branches: [feature/talent-marketplace-migration]
    paths: [.github/workflows/dependency-repair-once.yml]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'youh4ck3dme/SERVIShub-Talent-Marketplace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve vulnerable dependencies
        run: |
          set -eux
          pnpm install --frozen-lockfile
          pnpm remove shadcn
          pnpm up next@16.3.8 eslint-config-next@16.3.8
          pnpm audit --fix=update || echo "Some advisories require manual review"
          pnpm audit --fix || echo "Some advisories still require manual review"
          pnpm install --no-frozen-lockfile
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/servishub_ci pnpm db:generate
          pnpm typecheck
      - name: Commit dependency changes to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes produced"
          else
            git commit -m 'fix(deps): patch vulnerable Next.js and transitive packages'
            git push origin HEAD:feature/talent-marketplace-migration
          fi
