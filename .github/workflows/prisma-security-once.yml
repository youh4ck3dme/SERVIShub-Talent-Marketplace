name: One-time Prisma security refresh

on:
  push:
    branches: [feature/talent-marketplace-migration]
    paths: [.github/workflows/prisma-security-once.yml]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'youh4ck3dme/SERVIShub-Talent-Marketplace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch stable Prisma and keep shadcn CSS build-only
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/servishub_ci
        run: |
          set -eux
          pnpm install --frozen-lockfile
          pnpm add -D shadcn@4.16.2
          pnpm up prisma@7.10.1 @prisma/client@7.10.1 @prisma/adapter-pg@7.10.1
          pnpm exec prisma validate
          pnpm db:generate
          pnpm typecheck
          pnpm audit --prod --audit-level high
      - name: Commit reviewed manifests, never modify main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m 'fix(deps): use patched Prisma 7.10.1 and move shadcn to build dependencies'
            git push origin HEAD:feature/talent-marketplace-migration
          fi
